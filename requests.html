<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Requests - NeighborKnot</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/explore.css">
</head>
<body class="explore-body">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container navbar-content">
            <div class="logo">
                <h1>Neighbor<span class="logo-knot">Knot</span></h1>
            </div>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="explore.html">Explore Skills</a>
                <a href="requests.html">Requests</a>
                <a href="profile.html">Profile</a>
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </div>
    </nav>

    <div class="explore-container" style="grid-template-columns: 1fr; max-width: 1200px; margin: 0 auto;">
        <!-- Main Content -->
        <main class="explore-content" style="padding-right: 0;">
            <div class="explore-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2>Skill Requests</h2>
                    <p>Help the community by fulfilling their skill requests</p>
                </div>
                <button class="btn btn-primary" id="post-request-btn"><i class="fa-solid fa-plus"></i> Post a Request</button>
            </div>

            <div id="requests-grid" class="skills-grid">
                <p class="loading">Loading requests...</p>
            </div>
        </main>
    </div>

    <!-- Post Request Modal -->
    <div id="request-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Post a Skill Request</h2>
                <button type="button" class="modal-close" id="close-request-modal">&times;</button>
            </div>
            <form id="post-request-form" class="modal-body">
                <div class="form-group">
                    <label for="request-skill-name">Skill Name</label>
                    <input type="text" id="request-skill-name" name="name" required placeholder="e.g., Python Programming">
                </div>

                <div class="form-group">
                    <label for="request-description">Description</label>
                    <textarea id="request-description" name="description" rows="3" required placeholder="Describe what you want to learn..."></textarea>
                </div>

                <div class="form-group">
                    <label for="request-category">Category</label>
                    <select id="request-category" name="category" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="music">Music</option>
                        <option value="languages">Languages</option>
                        <option value="fitness">Fitness</option>
                        <option value="cooking">Cooking</option>
                        <option value="art">Art & Design</option>
                        <option value="tech">Technology</option>
                        <option value="business">Business</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="request-tokens">Tokens willing to pay (per hour)</label>
                    <input type="number" id="request-tokens" name="tokens" min="1" max="100" value="5" required>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" id="cancel-request-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Post Request</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/requests.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
